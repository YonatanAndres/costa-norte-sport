<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Costa Norte Sport</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--green:#16a34a;--yellow:#ca8a04;--blue:#2563eb;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{background:#111827;color:#fff;padding:16px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:21px}header small{opacity:.7}
nav{display:flex;gap:6px;overflow:auto;background:#fff;border-bottom:1px solid var(--line);padding:8px;position:sticky;top:69px;z-index:4}nav button{white-space:nowrap;border:0;border-radius:10px;padding:10px 12px;font-weight:700;background:#f3f4f6}nav .active{background:#111827;color:#fff}
main{max-width:950px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:0 0 8px}label{display:block;font-size:12px;font-weight:700;color:#4b5563;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;font:inherit;background:#fff}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;background:#111827;color:#fff}button.green{background:var(--green)}button.blue{background:var(--blue)}button.red{background:var(--red)}button.secondary{background:#e5e7eb;color:#111827}
.slot{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0}.available{border-left:5px solid var(--green)}.pending{border-left:5px solid var(--yellow)}.confirmed{border-left:5px solid var(--red)}.fixed{border-left:5px solid var(--blue)}.blocked{border-left:5px solid #374151}
.badge{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:#eef2f7}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{font-size:11px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:24px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>⚽ Costa Norte Sport</h1><small>Barrio Ibáñez · San Vicente, Misiones</small></header>
<nav id="nav"></nav><main id="app"></main><script src="app.js"></script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script></body></html>
